name: Release image

# Publishes the backend image for a GitHub release to GHCR, multi-arch
# (linux/amd64 + linux/arm64), with the tags X.Y.Z, X.Y and - for a full
# release - latest. Each architecture is built on its own native runner and
# must pass tests/test_docker.py before anything is pushed; the two digests
# are then joined into one manifest list.
#
# Runs on its own when a release is published; workflow_dispatch rebuilds an
# existing tag (a failed run, or a refreshed base image for security fixes).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.15.34
        required: true
      latest:
        description: Also move the `latest` tag
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and push (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag must be the version the code says
        run: |
          version="$(python3 -c "import re,pathlib;print(re.search(r'VERSION = \"([^\"]+)\"', pathlib.Path('pyserver/app/config.py').read_text()).group(1))")"
          echo "config.VERSION=$version tag=$TAG"
          test "v$version" = "$TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: risu-hina:release-test

      - name: Smoke-test the image (auth, persistence, update refusal, shutdown)
        run: python3 tests/test_docker.py --image risu-hina:release-test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Risu Hina backend
            org.opencontainers.image.description=Risu Hina backend for RisuAI (plugin installed separately)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=NOASSERTION
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the manifest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag X.Y.Z, X.Y and latest
        env:
          PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
          MOVE_LATEST: ${{ github.event_name == 'release' || inputs.latest }}
        run: |
          version="${TAG#v}"
          minor="${version%.*}"
          tags=(-t "$IMAGE:$version" -t "$IMAGE:$minor")
          if [ "$PRERELEASE" != "true" ] && [ "$MOVE_LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          cd /tmp/digests
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"
